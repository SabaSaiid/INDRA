[pytest]
asyncio_mode = auto
testpaths = alert_engine/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: tests requiring a running INDRA backend (localhost:8000)
    e2e: full end-to-end golden scenario tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

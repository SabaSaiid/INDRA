[pytest]
testpaths = tests
asyncio_mode = auto
; app.core.database creates one module-level asyncpg engine/pool at import time.
; A per-function event loop would strand that pool's connections on a dead loop and
; raise "Event loop is closed" during teardown, so the whole suite shares one loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: requires a live Postgres/Redpanda stack (run with `docker compose up -d`)
    network: calls a real external API (Open-Meteo); deselect with -m "not network"
    objectstore: needs the S3 object store (`docker compose up -d objectstore`); skips itself when it is not answering
filterwarnings =
    ignore::DeprecationWarning

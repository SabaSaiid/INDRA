services:
  # -------------------------------------------------------------
  # PostgreSQL + PostGIS: Geospatial Data Engine
  # Stores spatial polygons, station readings, reports, and verified events
  # -------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: indra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: indra_db
      POSTGRES_USER: indra_user
      POSTGRES_PASSWORD: indra_password
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Over TCP, not the Unix socket (BUG-028). On a fresh volume the entrypoint
    # runs a temporary server on the socket only, creates indra_db and the
    # PostGIS extension, then shuts it down and starts the real one. A socket
    # probe goes green on the temporary server — before indra_db exists, and
    # seconds before that server is killed. The real server is the first to
    # listen on TCP, so healthy now means the database is there to migrate.
    # Measured on a fresh container: socket green at 1.1 s, TCP at 3.5 s,
    # after "PostgreSQL init process complete".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U indra_user -d indra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redis: Low-latency In-Memory Cache & WebSocket Pub/Sub
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: indra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redpanda: Lightweight Kafka-compatible Event Streaming Bus
  # Carries the report stream (indra.raw.reports, its DLQ) and verified events (indra.verified.events)
  # -------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: indra-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # -------------------------------------------------------------
  # SeaweedFS: S3-compatible object storage (layer 7, Phase 2 T1)
  # The data lake's raw "bronze" layer (indra-lake) and, from Phase 5, report
  # media (indra-media). The backend speaks plain S3 to it through boto3, so it
  # can be swapped for MinIO, Garage or real S3 with a config change only.
  # MinIO's Docker Hub repository is gone, which is why this is not MinIO.
  #
  # infra/seaweedfs/s3.json holds the access keys and is gitignored. Generate it
  # BEFORE the first `docker compose up`: if the file is missing, Docker creates
  # an empty directory at that path and the S3 gateway refuses to start.
  #   python scripts/make_s3_config.py
  # -------------------------------------------------------------
  objectstore:
    # 4.47, the newest release on 24 Sep 2026 (published 14 Sep).
    image: chrislusf/seaweedfs:4.47
    container_name: indra-objectstore
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json"
    ports:
      # S3 API, bound to localhost only: never exposed to the internet.
      - "127.0.0.1:8333:8333"
    volumes:
      - objectstore_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  objectstore_data:
